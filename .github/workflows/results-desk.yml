name: HSD Legacy Results Desk - Manual Quarantined

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-readonly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Legacy quarantine notice
        run: |
          echo "This legacy results workflow is quarantined."
          echo "Use the HSD V3 Repo State Sanity workflow for current artifact-only runs."
