name: HSD Worker News Sync v1.8.2 Manual Only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hsd-repo-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  news-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-news-sync.txt

      - name: Run News Sync v1.8.2
        env:
          HSD_NEWS_MAX_MUST_POST: "5"
          HSD_NEWS_MAX_STRONG_MAYBE: "5"
          HSD_NEWS_MAX_DIVERSITY_PROMOTIONS: "4"
          HSD_NEWS_MAX_SOCCER_DIVERSITY: "3"
          HSD_NEWS_ENABLE_FETCH: "true"
          HSD_NEWS_REQUIRE_EVENT_DATE: "true"
        run: python generate_hsd_news_sync_v1.py

      - name: Generate news dashboard
        run: python generate_news_dashboard_v1.py

      - name: Archive news sync run
        run: python archive_news_runs_v1.py

      - name: Upload news sync artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsd-news-sync-v1-8-2
          path: news_run_history/latest/

      - name: Confirm artifact-only news sync run
        if: always()
        shell: bash
        run: |
          echo "News sync outputs are artifact-only. This workflow does not commit, push, publish, or update main."
