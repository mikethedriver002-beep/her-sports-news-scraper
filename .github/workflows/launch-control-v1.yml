name: Her Sports Daily Launch Control v1.1.2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hsd-repo-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  launch-control:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate and archive launch-control artifact only
        shell: bash
        run: |
          set -euo pipefail
          python generate_hsd_launch_control_v1.py
          python archive_hsd_launch_runs_v1.py
          echo "Launch-control outputs are artifact-only. This workflow does not commit, push, publish, or update main."

      - name: Upload Launch Control artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsd-launch-control-v1-1-2
          path: launch_run_history/latest/
