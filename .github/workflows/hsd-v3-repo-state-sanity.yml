name: HSD V3 Repo State Sanity
run-name: HSD V3 Repo State Sanity • run ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      strict:
        description: "Fail if repo_state_v3 strict audit finds acceptance/free-only failures?"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read
  actions: read

concurrency:
  group: hsd-v3-repo-state-sanity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repo-state-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      HSD_LOCAL_TIMEZONE: "America/New_York"
      HSD_PAID_SOURCES_ALLOWED: "0"
      HSD_PUBLISH_OUTPUTS: "false"
      HSD_PUBLISH_MODE: "artifact_only"
      HSD_REVIEW_ARTIFACT_SIZE: "lite"
      HSD_RUN_MODE: "full_pipeline"
      HSD_CONTENT_VOLUME: "balanced"
      HSD_DESK_DAY_TYPE: "normal_day"
      HSD_STRICT_FRESHNESS_GATE: "1"
      HSD_MAX_RESULT_FRESH_HOURS: "18"
      HSD_STUDIO_REQUIRE_EVENT_DATE: "1"
      HSD_STUDIO_MAX_RESULT_AGE_HOURS: "18"
      HSD_GREY_SOURCE_MODE: "review_only"
      HSD_DAILY_CADENCE_CONFIG: "config/hsd_daily_cadence_v2.json"
      HSD_PRIORITY_SPORTS_CONFIG: "config/hsd_priority_sports_14d_v2.json"
      HSD_PLATFORM_POLICY_CONFIG: "config/hsd_platform_policy_v2.json"
      HSD_EXACT_ASSET_POLICY_CONFIG: "config/hsd_exact_asset_policy_v1.json"
      HSD_VERIFIED_LOGO_REGISTRY: "config/hsd_verified_logo_registry_v1.json"
      HSD_REQUIRE_EXACT_TEAM_LOGOS: "1"
      HSD_TEXT_LOGO_FALLBACK_ALLOWED: "0"
      HSD_PREVIEW_LOOKAHEAD_HOURS: "30"
      HSD_ALLOW_PREVIEW_PLAYER_IMAGES: "1"
      HSD_PREVIEW_REQUIRE_COMPLETE_SLATE: "1"
      HSD_PREVIEW_ALLOW_NEXT_DAY: "0"
      HSD_REQUIRE_PREVIEW_PEOPLE: "0"
      HSD_NEWS_REQUIRE_EVENT_DATE: "true"
      HSD_NEWS_ENABLE_FETCH: "true"
      HSD_ASSET_RIGHTS_MODE: "aggressive_public_review"
      HSD_ASSET_DOWNLOAD: "1"
      HSD_PLAYER_IMAGES_REQUIRED: "1"
      HSD_PLAYER_IMAGE_FREE_SEARCH: "1"
      HSD_PLAYER_IMAGE_MAX_CANDIDATES: "24"
      HSD_FINAL_SCORE_STORIES_ENABLE_ESPN_FETCH: "1"
      HSD_FINAL_SCORE_STORIES_POLICY: "config/hsd_final_score_stories_policy_v1.json"
      HSD_FINAL_SCORE_STORIES_NETWORK: "1"
      HSD_FINAL_SCORE_STORIES_FETCH_TIMEOUT_SECONDS: "5"
      HSD_PLAYER_IMAGE_AUTO_APPROVE_SCORE: "45"
      HSD_PLAYER_IMAGE_MIN_WIDTH: "240"
      HSD_PLAYER_IMAGE_MIN_HEIGHT: "240"
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install free dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-news-sync.txt ]; then pip install -r requirements-news-sync.txt; fi
          if [ -f requirements-asset-visual-qa.txt ]; then pip install -r requirements-asset-visual-qa.txt; fi
          python -m pip install feedparser beautifulsoup4 jsonschema python-dateutil pillow requests cairosvg pytest >/dev/null 2>&1 || true

      - name: Verify install
        shell: bash
        run: python verify_hsd_install_v1.py

      - name: Build and validate WNBA asset registry
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fetch_hsd_wnba_logo_sources_v1.py || true
          python scripts/build_hsd_wnba_asset_registry_v1.py
          python scripts/validate_hsd_wnba_asset_registry_v1.py || true
          python scripts/report_hsd_wnba_asset_gaps_v1.py || true

      - name: Build upstream packets for V3 sanity
        shell: bash
        run: |
          set -euo pipefail
          python build_hsd_run_manifest_v1.py || true
          python generate_hsd_source_registry_audit_v2.py || true
          python normalize_hsd_manual_story_inbox_v1.py || true
          python ingest_hsd_discovery_sources_v1.py || true
          if [ -f generate_hsd_results_desk_v5.py ]; then python generate_hsd_results_desk_v5.py || true; python scripts/generate_hsd_expected_games_v5.py || true; python scripts/verify_hsd_wnba_schedule_independent_v5.py || true; python generate_hsd_results_desk_v5.py || true; fi
          if [ -f scripts/generate_hsd_multisport_results_modules_v5.py ]; then python scripts/generate_hsd_multisport_results_modules_v5.py || true; fi
          if [ -f generate_results_dashboard_v4.py ]; then python generate_results_dashboard_v4.py || true; fi
          if [ -f archive_results_runs_v4.py ]; then python archive_results_runs_v4.py || true; fi
          python generate_hsd_results_contract_v1.py || true
          python validate_hsd_contracts_v1.py --soft || true
          python build_hsd_daily_slate_v1.py || true
          python generate_hsd_final_score_stories_v1.py || true
          python generate_hsd_story_results_brand_lock_v1.py || true
          python generate_hsd_manual_workflow_merge_v1.py || true
          python generate_hsd_multi_post_desk_v1.py || true
          python generate_hsd_bebe_daily_ops_plan_v2.py || true
          python generate_hsd_mermaid_upper_echelon_v2.py || true
          if [ -f generate_hsd_mermaid_assignment_handoff_v2_6.py ]; then python generate_hsd_mermaid_assignment_handoff_v2_6.py || true; fi
          if [ -f generate_hsd_mermaid_handoff_publisher_v2_6_1.py ]; then python generate_hsd_mermaid_handoff_publisher_v2_6_1.py || true; fi

      - name: V5B cinematic renderer and quality outputs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_hsd_mermaid_production_graphics_director_v4_5.py
          python scripts/generate_hsd_graphics_variant_packs_v1.py
          if [ -f scripts/generate_hsd_graphics_template_factory_v1.py ]; then python scripts/generate_hsd_graphics_template_factory_v1.py; fi
          python scripts/run_hsd_template_renderer_v3.py
          python scripts/build_hsd_quality_graphics_from_renderer_v3.py
          if [ -f scripts/package_hsd_quality_graphics_v1.py ]; then python scripts/package_hsd_quality_graphics_v1.py; fi
          python generate_hsd_pipeline_review_lite_v1.py
          # Retired legacy renderer reference for regression audit only:
          # python scripts/generate_hsd_quality_graphics_renderer_v1.py

      - name: Run V5B renderer logo status audit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/report_hsd_template_renderer_logo_status_v1.py \
            --logo-audit-json outputs/latest/HSD_TEMPLATE_FACTORY/template_renderer_v3/hsd_template_renderer_v3_logo_audit.json \
            --manifest-json outputs/latest/HSD_TEMPLATE_FACTORY/template_renderer_v3/hsd_template_renderer_v3_manifest.json \
            --json outputs/latest/HSD_TEMPLATE_FACTORY/template_renderer_v3/hsd_template_renderer_v3_logo_status.json \
            --md outputs/latest/HSD_TEMPLATE_FACTORY/template_renderer_v3/hsd_template_renderer_v3_logo_status.md
          mkdir -p outputs/latest/HSD_TEMPLATE_FACTORY/template_renderer_v2
          cp outputs/latest/HSD_TEMPLATE_FACTORY/template_renderer_v3/hsd_template_renderer_v3_logo_status.json outputs/latest/HSD_TEMPLATE_FACTORY/template_renderer_v2/hsd_template_renderer_v2_logo_status.json
          cp outputs/latest/HSD_TEMPLATE_FACTORY/template_renderer_v3/hsd_template_renderer_v3_logo_status.md outputs/latest/HSD_TEMPLATE_FACTORY/template_renderer_v2/hsd_template_renderer_v2_logo_status.md

      - name: Run V4 source truth guard
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event.inputs.strict }}" == "true" ]]; then
            python scripts/report_hsd_v4_source_truth_guard.py --strict
          else
            python scripts/report_hsd_v4_source_truth_guard.py
          fi

      - name: Run V3 repo-state audit
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event.inputs.strict }}" == "true" ]]; then
            python scripts/report_hsd_repo_state_v3.py --strict
          else
            python scripts/report_hsd_repo_state_v3.py
          fi

      - name: Merge V4 guard into repo-state audit
        if: always()
        shell: bash
        run: |
          python scripts/merge_hsd_v4_guard_into_repo_state.py || true

      - name: Run V4 generated output pollution audit
        if: always()
        shell: bash
        run: |
          python scripts/report_hsd_generated_output_pollution_v1.py || true

      - name: Run V4 dirty tree category audit
        if: always()
        shell: bash
        run: |
          python scripts/report_hsd_dirty_tree_v1.py || true

      - name: Run V4 production readiness gate
        if: always()
        shell: bash
        run: |
          python scripts/report_hsd_production_readiness_v1.py || true
          if [[ "${{ github.event.inputs.strict }}" == "true" ]]; then
            python scripts/align_hsd_production_readiness_v1.py --strict
          else
            python scripts/align_hsd_production_readiness_v1.py || true
          fi
          # Phase 4A legacy strict reference: python scripts/report_hsd_production_readiness_v1.py --strict

      - name: Run V5 post-ready visual QA
        if: always()
        shell: bash
        run: |
          if [[ "${{ github.event.inputs.strict }}" == "true" ]]; then
            python scripts/report_hsd_post_ready_visual_qa_v1.py --strict
          else
            python scripts/report_hsd_post_ready_visual_qa_v1.py || true
          fi

      - name: Free-only guard tests
        shell: bash
        run: |
          pytest tests/test_no_paid_sources.py tests/test_results_v5_wiring.py tests/test_v4_source_truth_guards.py tests/test_v4_phase2b_repo_state_and_logo_status.py tests/test_v4_phase2c_generated_output_control.py tests/test_v4_phase2e_dirty_tree_hygiene.py tests/test_phase3_expected_games_baseline.py tests/test_phase3_independent_verifier_rebuild.py tests/test_phase4_production_readiness_gate.py tests/test_phase4b_production_output_alignment.py tests/test_phase5_post_ready_visual_qa.py tests/test_phase5b_renderer_visual_upgrade.py

      - name: Upload V3 sanity artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsd-v3-repo-state-sanity-${{ github.run_number }}
          path: |
            repo_state_v3.md
            repo_state_v3.json
            v4_source_truth_guard.md
            v4_source_truth_guard.json
            production_readiness_v1.md
            production_readiness_v1.json
            post_ready_assets_v1.csv
            review_only_assets_v1.csv
            daily_operator_brief_v1.md
            post_ready_visual_qa_v1.md
            post_ready_visual_qa_v1.json
            visual_qa_approved_assets_v1.csv
            visual_qa_blocked_assets_v1.csv
            operator_posting_handoff_v1.md
            generated_output_pollution_v1.md
            generated_output_pollution_v1.json
            dirty_tree_v1.md
            dirty_tree_v1.json
            hsd_pipeline_lite_review.zip
            hsd_pipeline_lite_review/**
            expected_games_v5_manifest.json
            expected_games_v5_report.md
            config/hsd_expected_games_v5.csv
            independent_schedule_verification_v5.csv
            independent_schedule_verification_v5.json
            independent_schedule_verification_v5.md
            multisport_results_observations_v5.csv
            multisport_results_modules_v5.json
            multisport_results_modules_v5.md
            outputs/latest/HSD_TEMPLATE_FACTORY/template_renderer_v2/**
            outputs/latest/HSD_TEMPLATE_FACTORY/template_renderer_v3/**
            hsd_quality_graphics.zip
            hsd_quality_graphics_zip_manifest.json
            hsd_quality_graphics_manifest.csv
            hsd_quality_graphics_report.md
            outputs/latest/HSD_QUALITY_GRAPHICS/**
            results_desk_v5_manifest.json
            results_desk_v5_report.md
            source_accuracy_v5.json
            source_accuracy_v5.md
            duplicate_game_audit_v5.csv
            stale_source_audit_v5.csv
            missing_games_alert_v5.json
            missing_games_alert_v5.md
            missing_games_alert_v5.csv
            source_observations.csv
            reconciled_events.csv
            today_womens_results.csv
            today_final_results.csv
            results_contract_v2.csv
            data/asset_registry/wnba/team_logos.csv
            data/asset_registry/wnba/missing_team_logos.csv
            data/asset_registry/wnba/logo_fetch_report.md
            data/asset_registry/wnba/logo_fetch_report.json
            data/asset_registry/wnba/asset_registry_report.md
            data/asset_registry/wnba/asset_registry_summary.json
            outputs/latest/production_graphics_director/copy_director/post_ready_copy.md
            outputs/latest/production_graphics_director/graphics_variant_packs/**
