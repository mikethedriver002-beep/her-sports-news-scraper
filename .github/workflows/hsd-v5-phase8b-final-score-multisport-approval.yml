name: HSD Phase 8B Artifact

on:
  workflow_dispatch:
    inputs:
      mode:
        description: fixture_audit or live_data
        required: true
        default: fixture_audit
        type: choice
        options:
          - fixture_audit
          - live_data
      strict:
        description: advisory only, reports always upload
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    branches:
      - main
    paths:
      - .github/workflows/hsd-v5-phase8b-final-score-multisport-approval.yml

permissions:
  contents: read
  actions: read

jobs:
  phase8b-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HSD_PHASE8B_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'fixture_audit' }}
      HSD_PUBLISH_OUTPUTS: "false"
      HSD_PUBLISH_MODE: artifact_only
      HSD_ASSET_DOWNLOAD: "1"
      HSD_REQUIRE_EXACT_TEAM_LOGOS: "0"
      HSD_TEXT_LOGO_FALLBACK_ALLOWED: "0"
      HSD_PLAYER_IMAGES_REQUIRED: "0"
      HSD_GREY_SOURCE_MODE: review_only
      HSD_TIMEZONE: America/New_York
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m pip install pillow cairosvg pytest requests pyyaml
          fc-match "Noto Sans Display"

      - name: Build Phase 8B reports and approval artifacts
        shell: bash
        run: |
          set +e
          MODE="${HSD_PHASE8B_MODE:-fixture_audit}"
          RENDER_ARGS=""
          if [ "$MODE" = "fixture_audit" ]; then RENDER_ARGS="--fixtures"; fi
          echo "Phase 8B mode: $MODE"
          python scripts/prepare_hsd_renderer_v4_live_assets.py
          python scripts/repair_hsd_phase8a_wnba_logo_registry.py
          python scripts/build_hsd_asset_assurance_v1.py
          if [ "$MODE" = "live_data" ]; then
            python build_hsd_run_manifest_v1.py || true
            python generate_hsd_results_desk_v5.py || true
            python scripts/generate_hsd_expected_games_v5.py || true
            python scripts/verify_hsd_wnba_schedule_independent_v5.py || true
            python generate_hsd_results_contract_v1.py || true
            python build_hsd_daily_slate_v1.py || true
            python generate_hsd_final_score_stories_v1.py || true
            python generate_hsd_story_results_brand_lock_v1.py || true
            python generate_hsd_manual_workflow_merge_v1.py || true
            python generate_hsd_multi_post_desk_v1.py || true
            python generate_hsd_mermaid_upper_echelon_v2.py || true
            python scripts/generate_hsd_mermaid_production_graphics_director_v4_5.py || true
            python scripts/generate_hsd_graphics_variant_packs_v1.py || true
            python scripts/report_hsd_v4_source_truth_guard.py || true
          fi
          python scripts/validate_hsd_template_contract_v4.py --strict
          python scripts/build_hsd_template_clean_plates_v4.py --strict
          python scripts/generate_hsd_template_renderer_v5_phase8b.py $RENDER_ARGS || true
          python scripts/validate_hsd_template_renderer_v4_phase6m.py || true
          python scripts/validate_hsd_template_fidelity_v4_phase6k.py || true
          python scripts/validate_hsd_near_post_ready_v4_phase6k.py || true
          python scripts/validate_hsd_final_score_content_modules_v4_phase6k.py || true
          python scripts/validate_hsd_story_context_cta_v4.py || true
          python scripts/validate_hsd_public_copy_quality_v4.py || true
          python scripts/validate_hsd_asset_assurance_v1.py || true
          python scripts/validate_hsd_phase8a_editorial_quality.py --mode "$MODE" || true
          python scripts/validate_hsd_phase8a_asset_registry.py --mode "$MODE" || true
          python scripts/validate_hsd_phase8b_result_language.py --mode "$MODE" || true
          python scripts/build_hsd_phase8b_multisport_daily_packets.py --mode "$MODE" || true
          python scripts/generate_hsd_phase8b_multisport_cards.py --mode "$MODE" || true
          python scripts/validate_hsd_live_post_ready_v5_phase7.py --mode "$MODE" || true
          python scripts/build_hsd_phase8b_live_approval_pack.py --mode "$MODE" || true
          pytest -q tests/test_phase8b_result_language.py tests/test_phase8b_daily_packets.py tests/test_phase8b_approval_pack.py tests/test_phase8b_workflow_trigger.py || true
          echo "Phase 8B artifact build complete" > phase8b_artifact_build_status.txt
          exit 0

      - name: Upload Phase 8B artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsd-phase8b-${{ env.HSD_PHASE8B_MODE }}-${{ github.run_number }}
          path: |
            *_report.json
            *_report.md
            phase8b_artifact_build_status.txt
            outputs/latest/HSD_TEMPLATE_FACTORY/template_renderer_v4/**
            outputs/latest/HSD_PHASE8B/**
            outputs/latest/HSD_PHASE8B_MULTISPORT/**
            outputs/latest/HSD_PHASE8B_APPROVAL_REVIEW/**
            outputs/latest/HSD_LIVE_POST_READY/**
          if-no-files-found: warn
