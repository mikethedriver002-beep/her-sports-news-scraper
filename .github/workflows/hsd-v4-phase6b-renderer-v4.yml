name: HSD V4 Phase 6B Template Renderer v4
run-name: HSD V4 Phase 6B Renderer v4 • run ${{ github.run_number }}

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hsd-v4-phase6b-renderer-v4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render-v4-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install free rendering dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pillow pytest

      - name: Validate Phase 6A contract first
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_hsd_template_contract_v4.py --strict

      - name: Run Renderer v4 fixtures
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_hsd_template_renderer_v4.py --fixtures --strict
          python scripts/validate_hsd_template_renderer_v4.py --strict

      - name: Run Renderer v4 tests
        shell: bash
        run: |
          set -euo pipefail
          pytest tests/test_template_renderer_v4_phase6b.py

      - name: Upload Phase 6B Renderer v4 artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsd-v4-phase6b-renderer-v4-${{ github.run_number }}
          path: |
            template_contract_v4_report.json
            template_contract_v4_report.md
            template_renderer_v4_validation_report.json
            template_renderer_v4_validation_report.md
            outputs/latest/HSD_TEMPLATE_FACTORY/template_renderer_v4/**
          if-no-files-found: warn
