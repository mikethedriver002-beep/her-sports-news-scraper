name: HSD Worker Asset Visual QA v1.8.3 Manual Only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hsd-repo-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  asset-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install asset dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-asset-visual-qa.txt

      - name: Generate and archive Asset Visual QA artifact only
        shell: bash
        env:
          HSD_ASSET_RIGHTS_MODE: aggressive_public_review
          HSD_ASSET_DOWNLOAD: "1"
          BING_SEARCH_API_KEY: ""
          SERPAPI_KEY: ""
          HSD_PLAYER_IMAGES_REQUIRED: "1"
          HSD_PLAYER_IMAGE_FREE_SEARCH: "1"
          HSD_PLAYER_IMAGE_MAX_CANDIDATES: "8"
          HSD_STRICT_FRESHNESS_GATE: "1"
          HSD_MAX_RESULT_FRESH_HOURS: "18"
        run: |
          set -euo pipefail
          python generate_hsd_asset_desk_v1.py
          python generate_hsd_player_image_assets_v1.py
          python generate_hsd_visual_upgrade_v2.py
          python generate_hsd_graphics_production_specs_v1.py
          python generate_hsd_graphics_language_pack_v1.py
          python generate_hsd_studio_freshness_gate_v1.py
          python generate_hsd_player_image_fit_gate_v1.py
          python generate_hsd_graphics_prompt_sanitizer_v1.py
          python generate_hsd_graphics_upload_pack_v1.py
          python generate_hsd_graphics_qa_v1.py
          python generate_hsd_rendered_slide_qa_v1.py
          python archive_hsd_asset_visual_qa_runs_v1.py
          echo "Asset Visual QA outputs are artifact-only. This workflow does not commit, push, publish, or update main."

      - name: Upload Asset Visual QA artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsd-asset-visual-qa-v1-8-3
          path: asset_run_history/latest/
