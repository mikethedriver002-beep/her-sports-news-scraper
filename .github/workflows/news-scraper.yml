name: HSD Legacy News Scraper - Manual Quarantined

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-readonly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Legacy quarantine notice
        run: |
          echo "This legacy news/dashboard workflow is quarantined."
          echo "It no longer runs on push or schedule and does not commit generated files."
          echo "Use the HSD V3 Repo State Sanity workflow for current artifact-only diagnostics."
